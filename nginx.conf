server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /tools/ {
    proxy_pass http://api:3000;
  }

  location /api/ {
    proxy_pass http://host.docker.internal:1234/v1/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri /index.html;
  }
}
